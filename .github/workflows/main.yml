name: Build Pragati APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Pragati Android project
        run: |
          mkdir project
          unzip -q "Pragati Android_Agent_V2.zip" -d project

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pragati-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
